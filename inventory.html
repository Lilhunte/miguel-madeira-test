<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaturas - Miguel Madeira – Car&Moto Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'brand-dark': '#111827',
                        'brand-light': '#f9fafb',
                        'brand-primary': '#3b82f6',
                        'brand-gray': '#9ca3af',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="public/styles/style.css">
</head>
<body class="bg-brand-dark text-brand-light font-sans">
    <header class="bg-brand-dark/70 backdrop-blur-md shadow-lg sticky top-0 z-40">
        <nav class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="text-2xl font-black text-brand-light"><a href="index.html">Car&Moto</a></div>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-brand-gray hover:text-brand-light transition-colors">Início</a>
                    <a href="inventory.html" class="text-brand-gray hover:text-brand-light transition-colors">Viaturas</a>
                    <a href="about.html" class="text-brand-gray hover:text-brand-light transition-colors">Sobre Nós</a>
                    <a href="contact.html" class="text-brand-gray hover:text-brand-light transition-colors">Contacto</a>
                </div>
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="text-brand-light focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                    </button>
                </div>
            </div>
            <div id="mobile-menu" class="hidden md:hidden mt-4 bg-brand-dark/90 rounded-lg p-4">
                <a href="index.html" class="block py-2 text-brand-gray hover:text-brand-light">Início</a>
                <a href="inventory.html" class="block py-2 text-brand-gray hover:text-brand-light">Viaturas</a>
                <a href="about.html" class="block py-2 text-brand-gray hover:text-brand-light">Sobre Nós</a>
                <a href="contact.html" class="block py-2 text-brand-gray hover:text-brand-light">Contacto</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-6 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-black text-brand-light">Nossas Viaturas</h1>
            <p class="text-brand-gray mt-4">Explore o nosso inventário de carros e motas.</p>
        </div>

        <form id="filter-form" class="bg-gray-900/50 backdrop-blur-sm p-6 rounded-lg shadow-lg mb-8 ring-1 ring-white/10">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 items-end">
                <div class="sm:col-span-2 md:col-span-4 lg:col-span-6">
                    <label for="search-input" class="block text-sm font-medium text-brand-gray">Procurar por Marca, Modelo, etc.</label>
                    <input type="text" id="search-input" name="search" placeholder="Ex: BMW, C200..." class="mt-1 block w-full rounded-md bg-gray-800 border-gray-700 text-brand-light shadow-sm focus:border-brand-primary focus:ring-brand-primary">
                </div>
                <div>
                    <label for="year-min-filter" class="block text-sm font-medium text-brand-gray">De (Ano)</label>
                    <input type="number" id="year-min-filter" name="year_min" placeholder="1990" class="mt-1 block w-full rounded-md bg-gray-800 border-gray-700 text-brand-light shadow-sm">
                </div>
                <div>
                    <label for="year-max-filter" class="block text-sm font-medium text-brand-gray">Até (Ano)</label>
                    <input type="number" id="year-max-filter" name="year_max" placeholder="2024" class="mt-1 block w-full rounded-md bg-gray-800 border-gray-700 text-brand-light shadow-sm">
                </div>
                <div>
                    <label for="transmission-filter" class="block text-sm font-medium text-brand-gray">Transmissão</label>
                    <select id="transmission-filter" name="transmission" class="mt-1 block w-full rounded-md bg-gray-800 border-gray-700 text-brand-light shadow-sm">
                        <option value="">Todas</option>
                        <option value="Automatic">Automática</option>
                        <option value="Manual">Manual</option>
                    </select>
                </div>
                <div>
                    <label for="fuel-filter" class="block text-sm font-medium text-brand-gray">Combustível</label>
                    <select id="fuel-filter" name="fuel_type" class="mt-1 block w-full rounded-md bg-gray-800 border-gray-700 text-brand-light shadow-sm">
                        <option value="">Todos</option>
                        <option value="Gasoline">Gasolina</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Electric">Elétrico</option>
                        <option value="Hybrid">Híbrido</option>
                    </select>
                </div>
                <div>
                    <label for="sort-select" class="block text-sm font-medium text-brand-gray">Ordenar por</label>
                    <select id="sort-select" name="sort" class="mt-1 block w-full rounded-md bg-gray-800 border-gray-700 text-brand-light shadow-sm">
                        <option value="created_at.desc">Mais Recentes</option>
                        <option value="price_eur.asc">Preço (Baixo)</option>
                        <option value="price_eur.desc">Preço (Alto)</option>
                        <option value="mileage_km.asc">Quilometragem (Baixa)</option>
                    </select>
                </div>
                <div>
                    <button type="reset" id="reset-btn" class="w-full bg-gray-600 text-white py-2 px-4 rounded-md hover:bg-gray-700">Limpar</button>
                </div>
            </div>
        </form>

        <div id="inventory-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <footer class="bg-transparent text-brand-gray py-8 mt-12">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2024 Miguel Madeira – Car&Moto Solutions. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="public/scripts/inventory.js"></script>
    <script src="public/scripts/main.js"></script>
    <div id="chatbot-container" class="fixed bottom-5 right-5 flex flex-col items-end z-50">
        <div id="chatbot-sticky-note" class="bg-yellow-200 text-gray-800 p-2 rounded-lg shadow-md mb-2 text-sm hidden opacity-0 transition-opacity duration-300">
            💬 Fala connosco em tempo real
        </div>
        <div id="chatbot-window" class="w-80 h-96 bg-white rounded-lg shadow-2xl hidden opacity-0 transition-opacity duration-500 flex flex-col">
            <header class="bg-brand-primary text-white p-3 flex justify-between items-center rounded-t-lg">
                <h3 class="font-bold">Chat com Assistente</h3>
                <button id="chat-close-btn" class="text-white hover:text-gray-200 text-2xl leading-none">&times;</button>
            </header>
            <main id="chat-messages" class="flex-grow p-4 overflow-y-auto">
                <div class="bg-gray-200 p-3 rounded-lg self-start max-w-xs text-sm">Olá! Como posso ajudar?</div>
            </main>
            <footer class="p-2 border-t">
                <div class="flex items-center bg-white border rounded-lg overflow-hidden">
                    <button id="chat-mic-btn" class="p-2 text-gray-500 hover:text-brand-primary focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
                    </button>
                    <input type="text" id="chat-input" placeholder="Escreva ou fale..." class="flex-grow p-2 border-none focus:outline-none focus:ring-0 bg-transparent">
                    <button id="chat-send-btn" class="bg-brand-primary text-white font-bold py-2 px-4 hover:bg-blue-700 transition-colors self-stretch">Enviar</button>
                </div>
            </footer>
        </div>
        <button id="chatbot-fab" class="bg-brand-primary text-white rounded-full w-16 h-16 flex items-center justify-center shadow-lg text-3xl transform hover:scale-110 transition-transform">
            💬
        </button>
    </div>
</body>
</html>
