<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Car&Moto Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Login View -->
    <div id="login-view">
        <div class="flex items-center justify-center h-screen">
            <div class="w-full max-w-xs p-4">
                <form id="login-form" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
                    <div class="mb-4">
                        <h1 class="text-2xl font-bold text-center text-gray-800">Admin Login</h1>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700" id="email" type="email" placeholder="Email" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3" id="password" type="password" placeholder="******************" required>
                    </div>
                    <div class="flex items-center justify-between">
                        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full" type="submit">Sign In</button>
                    </div>
                    <p id="error-message" class="text-red-500 text-xs italic mt-4 h-4"></p>
                </form>
                <p class="text-center text-gray-500 text-xs">&copy;2024 Miguel Madeira – Car&Moto Solutions</p>
            </div>
        </div>
    </div>

    <!-- Dashboard View (hidden by default) -->
    <div id="dashboard-view" class="hidden">
        <nav class="bg-white shadow-md">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold text-gray-800">Admin Dashboard</h1>
                <div>
                    <button id="change-password-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline mr-4">Alterar Senha</button>
                    <button id="logout-button" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Logout</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto px-6 py-12">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Gestão de Inventário</h2>
                <button id="add-vehicle-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300">&#43; Adicionar Viatura</button>
            </div>
            <div id="vehicle-form-container" class="hidden bg-white p-8 rounded-xl shadow-lg mb-8 transition-all duration-500">
                 <h3 id="form-title" class="text-2xl font-bold mb-6 text-gray-800">Adicionar Nova Viatura</h3>
                <form id="vehicle-form">
                    <input type="hidden" id="vehicle-id">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="md:col-span-4">
                             <label for="title" class="block text-sm font-medium text-gray-700">Título do Anúncio</label>
                             <input type="text" id="title" name="title" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label for="make" class="block text-sm font-medium text-gray-700">Marca</label>
                            <input type="text" id="make" name="make" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                        </div>
                        <div>
                            <label for="model" class="block text-sm font-medium text-gray-700">Modelo</label>
                            <input type="text" id="model" name="model" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                        </div>
                        <div>
                            <label for="variant" class="block text-sm font-medium text-gray-700">Versão</label>
                            <input type="text" id="variant" name="variant" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        </div>
                         <div>
                            <label for="year" class="block text-sm font-medium text-gray-700">Ano</label>
                            <input type="number" id="year" name="year" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                        </div>
                        <div>
                            <label for="price_eur" class="block text-sm font-medium text-gray-700">Preço (€)</label>
                            <input type="number" id="price_eur" name="price_eur" step="0.01" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                        </div>
                        <div>
                            <label for="mileage_km" class="block text-sm font-medium text-gray-700">Quilometragem (km)</label>
                            <input type="number" id="mileage_km" name="mileage_km" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                        </div>
                        <div>
                            <label for="engine_cc" class="block text-sm font-medium text-gray-700">Cilindrada (cc)</label>
                            <input type="number" id="engine_cc" name="engine_cc" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        </div>
                        <div>
                            <label for="power_cv" class="block text-sm font-medium text-gray-700">Potência (cv)</label>
                            <input type="number" id="power_cv" name="power_cv" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        </div>
                        <div>
                            <label for="fuel_type" class="block text-sm font-medium text-gray-700">Combustível</label>
                            <select id="fuel_type" name="fuel_type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                                <option value="Gasoline">Gasolina</option>
                                <option value="Diesel">Diesel</option>
                                <option value="Electric">Elétrico</option>
                                <option value="Hybrid">Híbrido</option>
                            </select>
                        </div>
                        <div>
                            <label for="transmission" class="block text-sm font-medium text-gray-700">Transmissão</label>
                            <select id="transmission" name="transmission" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                                <option value="Automatic">Automática</option>
                                <option value="Manual">Manual</option>
                            </select>
                        </div>
                        <div>
                            <label for="location" class="block text-sm font-medium text-gray-700">Localização</label>
                            <input type="text" id="location" name="location" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                        </div>
                        <div>
                            <label for="status" class="block text-sm font-medium text-gray-700">Estado</label>
                            <select id="status" name="status" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                                <option value="available">Disponível</option>
                                <option value="reserved">Reservado</option>
                                <option value="sold">Vendido</option>
                            </select>
                        </div>
                         <div class="md:col-span-4">
                            <label for="description" class="block text-sm font-medium text-gray-700">Descrição</label>
                            <textarea id="description" name="description" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
                        </div>
                        <div class="md:col-span-4">
                            <label for="images" class="block text-sm font-medium text-gray-700">Imagens</label>
                            <input type="file" id="images" name="images" multiple class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                        </div>
                    </div>
                    <div class="mt-8 flex justify-end space-x-4">
                        <button type="button" id="cancel-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancelar</button>
                        <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg">Salvar Viatura</button>
                    </div>
                </form>
            </div>
            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Viatura</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Preço</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ano</th>
                                <th scope="col" class="relative px-6 py-3"><span class="sr-only">Ações</span></th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="text-center py-10 text-gray-500">
                                    <div id="loading-state">A carregar inventário...</div>
                                    <div id="empty-state" class="hidden">Nenhuma viatura encontrada.</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <div id="password-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
            <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md mx-4">
                <h3 class="text-2xl font-bold mb-6">Alterar Senha</h3>
                <form id="password-form">
                    <div>
                        <label for="new_password" class="block text-sm font-medium text-gray-700">Nova Senha</label>
                        <input type="password" id="new_password" name="new_password" required minlength="6" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                    <div class="mt-4">
                        <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirmar Nova Senha</label>
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="6" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
                    </div>
                    <p id="password-error" class="text-red-500 text-sm mt-2 h-5"></p>
                    <div class="mt-8 flex justify-end space-x-4">
                        <button type="button" id="cancel-password-btn" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancelar</button>
                        <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg">Atualizar Senha</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
</body>
</html>
